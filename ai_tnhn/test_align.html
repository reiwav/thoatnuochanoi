<!DOCTYPE html>
<html>
<head>
<style>
.card { border: 1px solid #ccc; padding: 10px; width: 300px; font-family: sans-serif; }
.row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 4px; gap: 8px; }
.address-box { display: flex; align-items: baseline; gap: 4px; overflow: hidden; flex: 1; min-width: 0; }
.icon { font-size: 11px; line-height: 1; }
.text { font-size: 11px; color: #666; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.value-box { padding: 2px 6px; border-radius: 4px; background: rgba(0,132,255,0.08); border-left: 2px solid #0084FF; flex-shrink: 0; }
.value-text { font-size: 13px; color: #0084FF; font-weight: 800; line-height: 1.2; }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="address-box">
      <span class="icon">📍</span>
      <span class="text">ĐỀN NGỌC SƠN</span>
    </div>
    <div class="value-box">
      <span class="value-text">769.50</span>
    </div>
  </div>
</div>
</body>
</html>
